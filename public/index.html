<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat grupal · WebSockets</title><link rel="stylesheet" href="/css/styles.css"></head>
<body><div id="app"><section id="login-screen" class="screen active"><div class="login-card"><span class="eyebrow">LABORATORIO · WEBSOCKETS</span><h1>Conversemos.</h1><p>Ingresa tu nombre. Recordaremos tu sesión en este navegador.</p><form id="login-form"><label for="name-input">Tu nombre</label><input id="name-input" maxlength="24" required autocomplete="nickname"><p id="login-error" class="error-text" role="alert"></p><button type="submit">Entrar al chat</button></form></div></section>
<section id="chat-screen" class="screen"><header class="topbar"><strong>Chat grupal</strong><div id="status" class="status" data-state="closed"><span class="dot"></span><span id="status-text">Desconectado</span></div></header><div class="layout"><aside class="sidebar"><span class="eyebrow">CONVERSACIONES</span><h2>Salas</h2><nav id="rooms-list" aria-label="Salas"></nav><form id="room-create-form"><label class="sr-only" for="room-create-input">Nueva sala</label><input id="room-create-input" maxlength="32" required placeholder="Nueva sala"><button id="room-create-btn" type="submit">Crear</button></form><h2>En esta sala <span id="user-count">0</span></h2><p class="muted">Haz clic en una persona para hablar en privado.</p><ul id="users-list"></ul></aside><main class="chat-main"><div class="conversation-heading"><div><h2 id="conversation-title" class="conversation-title">General</h2><p id="conversation-subtitle"></p></div><button id="back-to-room" class="secondary" type="button" hidden>← Volver a la sala</button></div><p id="notice" role="status"></p><div id="message-area" class="message-area" aria-live="polite"></div><div id="reply-preview" hidden><span id="reply-text"></span><button id="reply-cancel" type="button">Cancelar</button></div><div id="typing-indicator" aria-live="polite"></div><p id="send-status" role="status"></p><form id="composer-form" class="composer"><label class="sr-only" for="composer-input">Mensaje</label><input id="composer-input" maxlength="1000" placeholder="Escribe un mensaje…" autocomplete="off"><button id="send-btn" type="submit">Enviar</button></form></main></div></section></div><script type="module" src="/js/app.js"></script></body></html>
